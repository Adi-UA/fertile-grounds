plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '8.8.0'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

repositories {
	// Modrinth's maven, only for the optional Jade integration (the setup Jade's docs recommend).
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fertilegrounds" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// In-world tests with Fabric API's GameTest module. Loom adds a separate "gametest" source set
// (src/gametest), which never ships in the mod jar, and a runGameTest task that runs every test on a
// headless server and fails the build if any test fails.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fertilegrounds-gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// Every GameTest run writes a JUnit-style report, and `-PgametestFilter=<pattern>` (for example
// '*fertilizer*') runs only the tests whose ids match.
loom.runs.matching { it.name == "gameTest" }.configureEach {
	vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file("gametest-report.xml").get().asFile}"
	if (project.hasProperty("gametestFilter")) {
		vmArg "-Dfabric-api.gametest.filter=${project.property("gametestFilter")}"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// Minecraft ${project.minecraft_version} ships unobfuscated, so there's no mapping step and
	// mod dependencies use plain `implementation` instead of `modImplementation`.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jade is optional: compiled against, never bundled, and only loaded through its own
	// entrypoint. Dev runs include it; pass -PnoJade to check the mod works without it.
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	gametestCompileOnly "maven.modrinth:jade:${project.jade_version}"
	if (!project.hasProperty("noJade")) {
		localRuntime "maven.modrinth:jade:${project.jade_version}"
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat()
		removeUnusedImports()
		importOrder()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('check') {
	dependsOn 'spotlessCheck'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
