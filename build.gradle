// Each loader's build plugin, declared once so every project shares one copy.
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddevgradle_version}" apply false
	id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
}
