# Builds the mod and runs every check on each push and pull request: compile, formatting, unit
# tests, then the in-world GameTests through scripts/run_gametests.py, which also fails on data files
# that only log a load error. A failed run keeps the test report and server log for download.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and unit tests
        run: ./gradlew build -x runGameTest
      - name: gametests and data-load scan
        run: python3 scripts/run_gametests.py
      - name: keep gametest report and log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-results
          path: |
            build/gametest-*-report.xml
            build/gametest.log
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: '*/build/libs/'
