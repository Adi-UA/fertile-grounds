pluginManagement {
	repositories {
		exclusiveContent {
			forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' } }
			filter { includeGroupAndSubgroups('net.fabricmc') }
		}
		exclusiveContent {
			forRepository { maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' } }
			filter { includeGroupAndSubgroups('net.neoforged') }
		}
		exclusiveContent {
			forRepository { maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' } }
			filter { includeGroupAndSubgroups('net.minecraftforge') }
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'fertilegrounds'

// One shared project for all game code and assets, plus one project per mod loader that builds
// that loader's jar from it. See AGENTS.md for which code goes where.
include('common')
include('fabric')
include('neoforge')
