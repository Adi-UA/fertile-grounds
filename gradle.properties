# Decompiling Minecraft for three loaders needs more than the default memory.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA breaks with the configuration cache: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
# The Minecraft versions the NeoForge and Forge jars accept
minecraft_version_range=[1.21.1,1.21.2)
loader_version=0.19.5
loom_version=1.17.17

# Mod Properties
mod_version=2.0.1
maven_group=com.fertilegrounds
mod_id=fertilegrounds

# Shared code compiles against plain Minecraft through NeoForm, from
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
moddevgradle_version=2.0.148

# NeoForge, from https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.264
jade_neoforge_version=15.10.6+neoforge

# Forge, from https://files.minecraftforge.net (the recommended build, so players on it can load the jar)
forge_version=52.1.20
# Forge builds for one Minecraft patch release, which can differ from minecraft_version.
forge_minecraft_version=1.21.1
# Forge only loads a mod's files with a pack.mcmeta; this is the data pack format in Minecraft's
# version.json ("data_major"), as Forge's MDK uses.
data_pack_format=48
forgegradle_version=7.0.40

# Dependencies
fabric_api_version=0.116.17+1.21.1
# Optional integration, from https://modrinth.com/mod/jade/versions
jade_version=15.10.6+fabric
# Dev-only shaders for recording (./gradlew runClient -Pshaders), from Modrinth
sodium_version=mc1.21.1-0.8.13-fabric
iris_version=1.8.8+1.21.1-fabric
junit_version=6.1.3

# Mixin and MixinExtras are only compiled against in common; each loader ships its own copy.
mixin_version=0.8.7
mixinextras_version=0.5.0

# ForgeGradle merges each source set's classes and resources for dev runs, as Forge's MDK does.
net.minecraftforge.gradle.merge-source-sets=true
