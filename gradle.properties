# Decompiling Minecraft for three loaders needs more than the default memory.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA breaks with the configuration cache: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
# The Minecraft versions the Forge jar accepts
minecraft_version_range=[1.20.1,1.20.2)
loader_version=0.20.1
loom_version=1.17.17

# Mod Properties
mod_version=2.0.1
maven_group=com.fertilegrounds
mod_id=fertilegrounds

# Shared code and the Forge jar build with ModDevGradle's legacyforge plugin, from
# https://projects.neoforged.net/neoforged/moddevgradle
moddevgradle_version=2.0.148

# Forge, from https://files.minecraftforge.net (the recommended build, so players on it can load the jar)
forge_version=47.4.28
# Forge builds for one Minecraft patch release, which can differ from minecraft_version.
forge_minecraft_version=1.20.1
jade_forge_version=11.13.3+forge
# NeoForge for 1.20.1, a fork of Forge 47, for the -PneoforgeCompat check in forge/build.gradle, from
# https://maven.neoforged.net/releases/net/neoforged/forge/
neoforge_compat_version=47.1.106
# Forge only loads a mod's files with a pack.mcmeta; this is the data pack format in Minecraft's
# version.json ("data_major"), as Forge's MDK uses.
data_pack_format=15

# Dependencies
fabric_api_version=0.92.12+1.20.1
# Optional integration, from https://modrinth.com/mod/jade/versions
jade_version=11.13.3+fabric
# Dev-only shaders for recording (./gradlew runClient -Pshaders), from Modrinth
sodium_version=mc1.20.1-0.5.13-fabric
iris_version=1.7.6+1.20.1
junit_version=6.1.3

# Mixin and MixinExtras are only compiled against in common; each loader ships its own copy.
mixin_version=0.8.7
mixinextras_version=0.5.0

