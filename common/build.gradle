// Compiled against plain Minecraft (NeoForm), so nothing here can use a mod loader's API.
plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

sourceSets {
	// Kept apart so Fabric's split source sets catch shared code that touches a client class.
	client {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
	gametest {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
	test {
		compileClasspath += gametest.output
		runtimeClasspath += gametest.output
	}
}

neoForge {
	neoFormVersion = neo_form_version
	addModdingDependenciesTo(sourceSets.client)
	addModdingDependenciesTo(sourceSets.gametest)
	addModdingDependenciesTo(sourceSets.test)
}

dependencies {
	compileOnly "org.spongepowered:mixin:${mixin_version}"
	compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

	// Jade's API is the same on every loader; common compiles against the NeoForge jar, the one that
	// uses Mojang's names like common does.
	compileOnly "maven.modrinth:jade:${jade_neoforge_version}"
	clientCompileOnly "maven.modrinth:jade:${jade_neoforge_version}"
	gametestCompileOnly "maven.modrinth:jade:${jade_neoforge_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Tests read repo files (docs/GUIDE.md, each loader's metadata) by repo-relative paths.
	workingDir = rootProject.projectDir
	inputs.files(rootProject.file("docs/GUIDE.md"), rootProject.file("gradle.properties"), fileTree("src"), fileTree("../fabric/src"), fileTree("../neoforge/src"), fileTree("../forge/src"))
}

// One vanilla test-instance file per @FertileTest method, so every loader loads the same tests.
def testInstances = layout.buildDirectory.dir("generated/testInstances")
def generateTestInstances = tasks.register('generateTestInstances', JavaExec) {
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'com.fertilegrounds.gametest.TestCatalog'
	args testInstances.get().asFile.absolutePath
	inputs.files(sourceSets.gametest.output)
	outputs.dir(testInstances)
	// Start empty, so a renamed or deleted test leaves no stale instance behind.
	doFirst { delete testInstances }
}

// What the loader projects read: each source set's Java and resource folders.
['main', 'client', 'gametest'].each { name ->
	def suffix = name.capitalize()
	def java = configurations.create("commonJava${suffix}") {
		canBeResolved = false
		canBeConsumed = true
	}
	def resources = configurations.create("commonResources${suffix}") {
		canBeResolved = false
		canBeConsumed = true
	}
	artifacts {
		add(java.name, sourceSets.getByName(name).java.sourceDirectories.singleFile)
		add(resources.name, sourceSets.getByName(name).resources.sourceDirectories.singleFile)
	}
}
artifacts {
	add('commonResourcesGametest', testInstances) { builtBy generateTestInstances }
}
