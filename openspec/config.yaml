schema: spec-driven

context: |
  Fertile Grounds is a cozy, lightweight vanilla+ mod for Fabric, NeoForge, and Forge, built from
  one shared codebase in common/. Features complement big farming
  mods (Farmer's Delight, Jade) instead of copying them, read shared tags so other mods' content
  works without code, and keep the vanilla look. docs/ROADMAP.md holds the release plan and the
  implementation order of changes.
  Release 2.0.0 targets Minecraft 26.1, 26.2, and 26.3 only; 1.21.11 and older stay on 1.2.0. Build every change on 26.3
  (main) first; backport to older branches only after every 2.0.0 change works on 26.3.
  Every tunable number sits behind a gamerule. Every player-facing string uses a translation key.
  No AI art ships: the maintainer draws or traces every texture in Aseprite from vanilla textures, and AI
  only supplies guides, templates, palettes, and placeholders. Specs describe the look, never pixels.
  Verification runs JUnit and GameTests with mock players (common/src/gametest) on every loader;
  every bug fixed adds a check.

rules:
  proposal:
    - State what is out of scope.
    - List the new art the maintainer must paint, or say none.
  specs:
    - Scenarios use WHEN/THEN and describe what a player or modpack maker observes.
    - Write numbers as defaults and name the gamerule that changes them.
  design:
    - Name any Minecraft, Fabric, NeoForge, or Forge API that differs between 26.1 and 26.3, and add it to the porting divergence table.
    - Include a short "Server safety" note per AGENTS.md: what the client sends (ideally nothing) and how the server checks it, what the feature saves on players or worlds and how it survives rejoin, death, leaving the End, and loading an older world, and the size of any block scan.
    - Include a "Look and sound" table with one row per player-facing moment (placing, breaking, using, ambient), naming its look, one vanilla sound, and one vanilla particle, all present in 26.1. Glowing parts use an emissive model layer the maintainer paints.
  tasks:
    - "Each task names its verification: a JUnit test, a GameTest run by `python3 scripts/run_gametests.py` (with a mock player for anything a player does), a `client_log_check.py` run, or an in-game checklist item for the maintainer."
    - "In-game checklist items are only for looks, sounds, and what a test server can't do (sleeping through the night, restarting a world); everything else gets a GameTest."
    - Include one task that checks the design's Look and sound table in `runClient` and adds it to the in-game checklist.
    - Keep Minecraft-free rules in their own class so JUnit covers them.
    - "New per-player data gets a GameTest that rejoins, dies, and leaves the End (like `GuideBookTests`); a new client-to-server packet gets a GameTest that sends it bad values and a too-far target."

operations:
  apply:
    guidance:
      - Follow AGENTS.md verification; a green build alone never counts as done.
      - Never overwrite painted textures; ask the maintainer for art before tasks that need it.
