modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Adi-UA/fertile-grounds/issues"

[[mods]]
modId = "fertilegrounds"
version = "${version}"
displayName = "Fertile Grounds"
displayURL = "https://github.com/Adi-UA/fertile-grounds"
iconFile = "assets/fertilegrounds/icon.png"
authors = "Adi Banerjee"
description = '''Tiered soil enrichment blocks that passively boost nearby crop growth.'''

[[mixins]]
config = "fertilegrounds.mixins.json"

[[dependencies.fertilegrounds]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.fertilegrounds]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.fertilegrounds]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
